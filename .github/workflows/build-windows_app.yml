name: Build Windows Executable

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --collect-all fitz --collect-all PySide6 --name "Indexador-PDFs" Indexacion.py

      - name: Subir Ejecutable como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Indexador-PDFs-Windows-Exe
          path: dist/Indexador-PDFs.exe
          retention-days: 7
